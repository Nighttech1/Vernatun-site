<!DOCTYPE html>
<html class="scroll-smooth" lang="ru" data-root="/">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta property="og:type" content="website" />
  <meta property="og:description" content="Твой армянский дом посреди города: практикуем язык за чашкой чая в камерных группах, играем в настолки, занимаемся спортом и находим близких по духу людей" />
  <meta name="description" content="Твой армянский дом посреди города: практикуем язык за чашкой чая в камерных группах, играем в настолки, занимаемся спортом и находим близких по духу людей" />
  <title>Расписание — Вернатун</title>
  <link rel="canonical" href="https://vernatunspeakclub.com/schedule" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js?v=20260920a"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
  <link rel="preload" href="/fonts/CenturyGothic.ttf?v=20260920a" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="/fonts/CenturyGothic-Bold.ttf?v=20260920a" as="font" type="font/ttf" crossorigin />
  <link rel="stylesheet" href="/css/site.css?v=20260920a" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
</head>
<body class="paper-grain min-h-screen antialiased text-azure" x-data="lightbox()" @keydown.escape.window="close()">
  <div id="site-header"></div>
  <script src="/js/calendar-feed.js?v=20261119-events1"></script>
  <script src="/js/site.js?v=20261119-events1"></script>
  <main>
    <section id="calendar" class="py-16 sm:py-20">
      <div class="mx-auto max-w-7xl px-4 sm:px-6">
        <div class="reveal text-center sm:text-left">
          <h1 class="font-display text-3xl font-bold text-azure sm:text-4xl">Расписание</h1>
          <p class="mt-2 max-w-2xl text-azure/75">Живые встречи каждую неделю. Нажмите на событие, чтобы открыть детали.</p>
        </div>

        <div class="reveal mt-10 grid items-stretch gap-6 lg:grid-cols-[minmax(0,1fr)_minmax(22.5rem,28.5rem)]" x-data="clubCalendar()" :aria-busy="loading" x-cloak>
          <div class="rounded-xl border border-azure/12 bg-white/80 p-4 text-sm text-azure/80 lg:col-span-2" x-show="loading || error || !events.length" role="status" aria-live="polite">
            <p x-show="loading">Загружаем расписание…</p>
            <p x-show="!loading && error" x-text="error"></p>
            <p x-show="!loading && !error && !events.length">В этом месяце пока нет опубликованных событий.</p>
            <button type="button" x-show="!loading && error" @click="reloadMonth()" class="mt-2 rounded-lg border border-azure/30 px-3 py-2 font-semibold">Попробовать снова</button>
          </div>
          <div class="overflow-hidden rounded-xl border border-azure/12 bg-white shadow-card">
            <div class="flex flex-wrap items-center justify-between gap-3 border-b border-mist bg-parchment/60 px-4 py-3 sm:px-5">
              <div class="flex items-center gap-2">
                <button type="button" @click="prevMonth()" class="cal-month-nav inline-flex size-11 items-center justify-center rounded-full text-azure transition hover:bg-azure/10 focus:outline-none focus-visible:ring-2 focus-visible:ring-sungold" aria-label="Предыдущий месяц">
                  <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                </button>
                <button type="button" @click="nextMonth()" class="cal-month-nav inline-flex size-11 items-center justify-center rounded-full text-azure transition hover:bg-azure/10 focus:outline-none focus-visible:ring-2 focus-visible:ring-sungold" aria-label="Следующий месяц">
                  <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                </button>
                <h3 class="font-display text-xl font-bold text-azure sm:text-2xl" x-text="title"></h3>
              </div>
            </div>

            <div class="cal-legend border-b border-mist bg-parchment/40 px-4 py-3 sm:px-5" aria-label="Легенда событий">
              <ul class="flex flex-wrap items-center justify-center gap-x-5 gap-y-2 sm:justify-start">
                <li class="cal-legend-item">
                  <span class="cal-legend-swatch cal-legend-swatch--talk" aria-hidden="true"></span>
                  <span>Разговорный клуб</span>
                </li>
                <li class="cal-legend-item">
                  <span class="cal-legend-swatch cal-legend-swatch--dance" aria-hidden="true"></span>
                  <span>Танцы</span>
                </li>
                <li class="cal-legend-item">
                  <span class="cal-legend-swatch cal-legend-swatch--volleyball" aria-hidden="true"></span>
                  <span>Волейбол</span>
                </li>
              </ul>
            </div>

            <div class="grid grid-cols-7 border-b border-mist bg-white/80 text-center text-[11px] font-semibold uppercase tracking-wider text-azure/50 sm:text-xs">
              <template x-for="day in weekDays" :key="day">
                <div class="border-r border-mist/80 py-2 last:border-r-0" x-text="day"></div>
              </template>
            </div>

            <div class="grid grid-cols-7 bg-mist/40 cal-month-grid">
              <template x-for="cell in flatCells" :key="cell.key">
                  <div
                    class="cal-cell cal-day border-b border-r border-mist/80 bg-white p-1 text-left last:border-r-0 sm:p-1.5"
                    :class="cell.inMonth ? '' : 'bg-parchment/50'"
                  >
                    <span
                      class="inline-flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-xs font-semibold sm:text-sm"
                      :class="cell.isToday ? 'bg-azure text-white' : (cell.inMonth ? 'text-azure' : 'text-azure/35')"
                      x-text="cell.date"
                    ></span>
                    <div class="cal-day-events mt-1.5 flex flex-col items-center gap-1">
                      <template x-for="ev in cell.events" :key="ev.id">
                        <button
                          type="button"
                          class="cal-pill"
                          :class="pillClass(ev.kind, selectedId === ev.id)"
                          :title="ev.time + ' В· ' + ev.title"
                          :aria-label="ev.kindLabel + ' ' + ev.time"
                          @click="selectId(ev.id)"
                          x-html="pillIcon(ev.kind)"
                        ></button>
                      </template>
                    </div>
                  </div>
              </template>
            </div>
          </div>

          <aside class="flex h-full min-h-full flex-col lg:sticky lg:top-24" aria-live="polite">
            <article
              class="event-card-enter flex h-full min-h-full flex-col overflow-hidden rounded-xl border border-azure/12 bg-white shadow-card"
              x-show="selected"
              :key="selected ? selected.id : 'empty'"
            >
              <img
                :src="selected && selected.image"
                :alt="selected ? selected.title : ''"
                class="event-card-photo w-full object-cover"
                width="640"
                height="480"
              />
              <div class="flex flex-1 flex-col space-y-3 p-5">
                <p class="text-right text-xs font-semibold text-azure/65" x-text="selected && (selected.dateLabel + ' В· ' + selected.time)"></p>
                <h3 class="break-words font-display text-2xl leading-tight text-azure" x-text="selected && selected.title"></h3>
                <p class="break-words text-sm leading-relaxed text-azure/80" x-text="selected && selected.description"></p>
                <p x-show="selected && selected.location" class="break-words text-sm text-azure/75" x-text="selected && selected.location"></p>
                <a x-show="selected && selected.url" :href="selected && selected.url" target="_blank" rel="noopener noreferrer" class="inline-flex self-start rounded-lg border border-azure/30 px-4 py-2 text-sm font-semibold">Подробнее о встрече</a>
              </div>
            </article>
            <div x-show="!selected && !loading && !error && events.length" class="rounded-xl border border-dashed border-azure/25 bg-white/70 p-6 text-sm leading-relaxed text-azure/75">
              Выберите событие в календаре — здесь откроются детали встречи.
            </div>
          </aside>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>VernatunChrome.mountRest();</script>
</body>
</html>
