# admin.vernatunspeakclub.com — Owner Inbox (live)
# Files: /home/infinity/vernatun-admin
# SSL: Let's Encrypt; listen 443 + 86

# Certbot manages 80 redirect + 443; we also listen 86 ssl.

server {
    server_name admin.vernatunspeakclub.com;
    root /home/infinity/vernatun-admin;
    index index.html;

    location /api/lounge/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Owner-Password $http_x_owner_password;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    listen 86 ssl;
    listen [::]:86 ssl;
    ssl_certificate /etc/letsencrypt/live/admin.vernatunspeakclub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.vernatunspeakclub.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = admin.vernatunspeakclub.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name admin.vernatunspeakclub.com;
    return 404;
}
