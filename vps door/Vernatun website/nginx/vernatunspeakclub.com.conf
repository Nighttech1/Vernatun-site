# Vernatun Armenian Club — static site
# App root: /home/infinity/Vernatun website/web
# DNS: vernatunspeakclub.com + www -> 155.212.187.181

# Shared location blocks via include-style duplication (port 85 + 443)

server {
    listen 85;
    listen [::]:85;
    server_name vernatunspeakclub.com www.vernatunspeakclub.com;

    root "/home/infinity/Vernatun website/web";
    index index.html;

    client_max_body_size 20M;

    # LiveKit signaling (WSS) — media uses UDP/TCP ICE ports on host
    location /rtc {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
    location /twirp {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Lounge API (token, rooms, webhooks) — secrets stay on localhost:8765
    location /api/lounge/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25M;
    }

    # React Campus SPA (do not fall through to marketing index.html)
    location = /lounge {
        return 301 /campus;
    }
    location = /lounge/ {
        return 301 /campus;
    }
    location ^~ /campus {
        try_files $uri /campus-app.html;
    }
    location ^~ /room {
        try_files $uri /campus-app.html;
    }
    location = /campus-app.html {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Vite hashed bundles for Campus SPA
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Clean URLs: /schedule → schedule.html; redirect *.html (except root index)
    location ~ ^/(.+)/index\.html$ {
        return 301 /$1/;
    }
    location ~ ^/(?!index\.html$|campus-app\.html$)(.+)\.html$ {
        return 301 /$1;
    }
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(css|js)$ {
        expires 10m;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
        types { font/ttf ttf; font/otf otf; font/woff woff; font/woff2 woff2; }
        default_type font/ttf;
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|mp4)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    access_log /var/log/nginx/vernatunspeakclub.com.access.log;
    error_log  /var/log/nginx/vernatunspeakclub.com.error.log;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.vernatunspeakclub.com;

    ssl_certificate /etc/letsencrypt/live/vernatunspeakclub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vernatunspeakclub.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://vernatunspeakclub.com$request_uri;
}

