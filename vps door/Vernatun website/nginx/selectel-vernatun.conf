server {
 listen 85;
 listen [::]:85;
 server_name vernatunspeakclub.com;
 root /var/www/vernatunspeakclub.com;
 index index.html;
 client_max_body_size 25M;
 location /api/lounge/ {
 proxy_pass http://127.0.0.1:8765;
 proxy_http_version 1.1;
 proxy_set_header Host $host;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 client_max_body_size 25M;
}
 location /rtc {
 proxy_pass http://127.0.0.1:7880;
 proxy_http_version 1.1;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection "upgrade";
 proxy_set_header Host $host;
 proxy_read_timeout 86400;
}
 location /twirp {
 proxy_pass http://127.0.0.1:7880;
 proxy_set_header Host $host;
}
 location = /lounge { return 301 /campus; }
 location ^~ /campus { try_files $uri /campus-app.html; }
 location ^~ /room { try_files $uri /campus-app.html; }
 location / { try_files $uri $uri.html $uri/ =404; }
 location ~ /\. { deny all; }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vernatun-web/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vernatun-web/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
 listen 86 ssl;
 listen [::]:86 ssl;
 server_name admin.vernatunspeakclub.com;
 root /var/www/vernatun-admin;
 index index.html;
 location /api/lounge/ {
 proxy_pass http://127.0.0.1:8765;
 proxy_http_version 1.1;
 proxy_set_header Host $host;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 client_max_body_size 25M;
}
 location / { try_files $uri $uri/ /index.html; }
 location ~ /\. { deny all; }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vernatun-web/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vernatun-web/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = vernatunspeakclub.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


 listen 80;
 listen [::]:80;
 server_name vernatunspeakclub.com;
 location / { proxy_pass http://127.0.0.1:85; proxy_set_header Host $host; }


}
server {
    if ($host = admin.vernatunspeakclub.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


 listen 80;
 listen [::]:80;
 server_name admin.vernatunspeakclub.com;
