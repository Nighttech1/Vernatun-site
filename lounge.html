<!DOCTYPE html>
<html class="scroll-smooth" lang="ru" data-root="/">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Голосовые комнаты Вернатун" />
  <title>Кампус — голосовые комнаты Вернатун</title>
  <link rel="canonical" href="https://vernatunspeakclub.com/lounge" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js?v=20260920d"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
  <link rel="preload" href="/fonts/CenturyGothic.ttf?v=20260920d" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="/fonts/CenturyGothic-Bold.ttf?v=20260920d" as="font" type="font/ttf" crossorigin />
  <link rel="stylesheet" href="/css/site.css?v=20260920d" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
</head>
<body class="paper-grain min-h-screen antialiased text-azure" x-data="lightbox()" @keydown.escape.window="close()">
  <div id="site-header"></div>
  <script src="/js/site.js?v=20260920d"></script>
  <main>
    <section class="py-16 sm:py-20" x-data="{ rooms: [], loading: true, error: '' }" x-init="
      fetch('/api/lounge/rooms').then(r => r.json()).then(d => { rooms = d.rooms || []; loading = false; }).catch(e => { error = e.message || String(e); loading = false; })
    ">
      <div class="mx-auto max-w-7xl px-4 sm:px-6">
        <div class="reveal text-center sm:text-left">
          <p class="text-xs font-bold uppercase tracking-widest text-terracotta">Кампус</p>
          <h1 class="mt-2 font-display text-3xl font-bold text-azure sm:text-4xl">Голосовые комнаты</h1>
          <p class="mt-3 max-w-2xl text-azure/75">
            Раздел Кампус — голосовая практика армянского. Выберите комнату:
            звук, общий чат и ссылка, чтобы позвать друзей. Без дейтинга и личных
            сообщений.
          </p>
        </div>

        <div class="mt-10 max-w-3xl space-y-3">
          <p class="text-sm text-azure/60" x-show="loading">Загружаем список…</p>
          <p class="text-sm text-terracotta" x-show="error" x-text="error"></p>
          <template x-for="r in rooms" :key="r.id">
            <a class="magazine-row group block" :href="'/room?room=' + encodeURIComponent(r.id)">
              <p class="text-xs font-bold uppercase tracking-widest text-terracotta" x-text="r.cefr === 'any' ? 'Открытая' : ('Уровень ' + r.cefr)"></p>
              <p class="font-display text-2xl text-azure group-hover:text-terracotta" x-text="r.title"></p>
              <p class="text-sm text-azure/65" x-text="r.description"></p>
              <p class="mag-open text-sm text-ink/50">
                <span x-text="(r.online || 0) + ' онлайн'"></span> · Открыть
              </p>
            </a>
          </template>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>VernatunChrome.mountRest();</script>
</body>
</html>
